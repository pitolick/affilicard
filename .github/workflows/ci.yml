name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  php:
    name: PHP (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v7
      - name: PHP セットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
      - name: Composer キャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
      - name: 依存関係インストール
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: PHPCS
        run: composer lint
      - name: PHPUnit
        run: composer test

  js:
    name: JS / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: 依存関係インストール
        run: npm ci
      - name: ESLint
        run: npm run lint:js
      - name: Jest
        run: npm run test:js
      - name: Build
        run: npm run build

  dependabot-auto-merge:
    needs: [php, js]
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: メタデータ取得
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # patch / minor はすべて自動マージする（dev / prod / indirect / Actions を問わない）。
      # 以前は direct:development に限っていたため、推移的依存（indirect）の minor が
      # 条件から漏れて滞留していた。グループ PR では update-type がグループ内の最大の
      # semver 変更を返すため、この 2 項だけで major の混入を弾ける。
      - name: patch / minor を自動マージ
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        # required status checks に含まれる e2e は別ワークフローのため needs: に書けない。
        # 直接マージだと e2e 完走前に叩いてしまうため --auto を使い、GitHub 側に待たせる。
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
