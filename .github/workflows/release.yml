name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: CHANGELOG にタグ対応セクションがあるか検証
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md に '## [${VERSION}]' セクションがありません。リリース前に追記してください。"
            exit 1
          fi
          echo "CHANGELOG にバージョン ${VERSION} のセクションを確認しました。"
      - name: コミット済み Version ヘッダがタグと一致するか検証（PUC 自動更新検知のため）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # plugin-update-checker はタグ名でなく、タグのツリーにコミットされた
          # affilicard.php の "Version:" ヘッダを最新版数として読む。zip へのビルド時注入だけでは
          # 検知されないため、コミット済みヘッダがタグと一致していることをリリース前に必須化する。
          COMMITTED="$(grep -E '^ \* Version:' affilicard.php | head -1 | sed -E 's/^ \* Version:[[:space:]]*//')"
          if [ "${COMMITTED}" != "${VERSION}" ]; then
            echo "::error::affilicard.php のコミット済み Version (${COMMITTED}) がタグ (${VERSION}) と一致しません。plugin-update-checker はタグのツリーの Version ヘッダを読むため、リリース前に affilicard.php の Version をタグと同じ値にコミットしてください。"
            exit 1
          fi
          echo "コミット済み Version (${COMMITTED}) = タグ (${VERSION}) を確認しました。"
      - name: タグからバージョンを affilicard.php / package.json に注入
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Injecting version: ${VERSION}"
          sed -i -E "s/^( \* Version:[[:space:]]*).*/\1${VERSION}/" affilicard.php
          sed -i -E "s/(define\( 'AFFILICARD_VERSION', ')[^']*(' \);)/\1${VERSION}\2/" affilicard.php
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")/\1${VERSION}\2/" package.json
          grep -nE "Version:|AFFILICARD_VERSION" affilicard.php
          grep -nE "\"version\"" package.json | head -1
      - name: PHP セットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - name: Node セットアップ
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: 本番依存のみインストール
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction
      - name: npm install
        run: npm ci
      - name: JS ビルド
        run: npm run build
      - name: Release zip 作成
        run: |
          mkdir -p dist/affilicard
          rsync -av \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src/Admin/components' \
            --exclude='src/Admin/api' \
            --exclude='tests' \
            --exclude='blueprints' \
            --exclude='composer.lock' \
            --exclude='package-lock.json' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpunit.xml.dist' \
            --exclude='.php-cs-fixer.dist.php' \
            --exclude='.php-cs-fixer.cache' \
            --exclude='.phpunit.cache' \
            --exclude='dist' \
            ./ dist/affilicard/
          cd dist
          zip -r ../affilicard-${{ github.ref_name }}.zip affilicard
      - name: GitHub Release 作成
        uses: softprops/action-gh-release@v3
        with:
          files: affilicard-${{ github.ref_name }}.zip
          generate_release_notes: true
