name: Release

# 2 通りで起動する。
# - タグの push（v*）: 従来どおり。タグのコミットをそのままリリースする
# - 手動実行（workflow_dispatch）: main の先頭コミットを version で検証し、通ればタグを作って
#   リリースする。タグを push できない環境（Claude Code のクラウドセッション等）からも
#   Actions の API だけでリリースできるようにするため
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン（例 4.1.1。先頭の v は不要）。main の affilicard.php・package.json・CHANGELOG と一致している必要がある'
        required: true
        type: string

permissions:
  contents: write

# リリースは 1 本ずつ走らせる（手動実行の二度押しで同じタグを作り合わないため）。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: リリースするバージョンとタグを決める
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # 手動実行は main からだけ。別ブランチのコミットにタグを打つと、main に無い変更が
            # 自動更新で配られてしまうため。
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::手動リリースは main からだけ実行できます（実行元: ${GITHUB_REF}）。"
              exit 1
            fi
            VERSION="${INPUT_VERSION#v}"
            if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::version (${INPUT_VERSION}) が x.y.z の形式ではありません。"
              exit 1
            fi
            TAG="v${VERSION}"
            # 既にあるタグへは打ち直さない（リリース済みの版の中身を差し替えないため）。
            if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
              echo "::error::タグ ${TAG} は既にあります。バージョンを上げてから実行してください。"
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "リリース: ${TAG}（コミット ${GITHUB_SHA}）"
      - name: CHANGELOG にリリースするバージョンのセクションがあるか検証
        run: |
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md に '## [${VERSION}]' セクションがありません。リリース前に追記してください。"
            exit 1
          fi
          echo "CHANGELOG にバージョン ${VERSION} のセクションを確認しました。"
      - name: コミット済み Version ヘッダがリリースするバージョンと一致するか検証（PUC 自動更新検知のため）
        run: |
          # plugin-update-checker はタグ名でなく、タグのツリーにコミットされた
          # affilicard.php の "Version:" ヘッダを最新版数として読む。zip へのビルド時注入だけでは
          # 検知されないため、コミット済みヘッダがタグと一致していることをリリース前に必須化する。
          COMMITTED="$(grep -E '^ \* Version:' affilicard.php | head -1 | sed -E 's/^ \* Version:[[:space:]]*//')"
          if [ "${COMMITTED}" != "${VERSION}" ]; then
            echo "::error::affilicard.php のコミット済み Version (${COMMITTED}) がリリースするバージョン (${VERSION}) と一致しません。plugin-update-checker はタグのツリーの Version ヘッダを読むため、リリース前に affilicard.php の Version をタグと同じ値にコミットしてください。"
            exit 1
          fi
          echo "コミット済み Version (${COMMITTED}) = リリースするバージョン (${VERSION}) を確認しました。"
          # AFFILICARD_VERSION は PluginUpgrade::maybeUpgrade() が「保存済みバージョンとの差分」を
          # 見る唯一の値で、移行バッチの起動条件そのものである。下の注入 sed が（行の書式変更などで）
          # 空振りしても sed は成功扱いで黙るため、コミット済みの時点で一致を必須にする。
          # git checkout で運用するインストール（zip を経由しない）でも、この値がコミット側で
          # 古いままだと移行が永久に走らない。
          COMMITTED_CONST="$(grep -E "define\( 'AFFILICARD_VERSION'," affilicard.php | head -1 | sed -E "s/.*'AFFILICARD_VERSION',[[:space:]]*'([^']*)'.*/\1/")"
          if [ "${COMMITTED_CONST}" != "${VERSION}" ]; then
            echo "::error::affilicard.php のコミット済み AFFILICARD_VERSION (${COMMITTED_CONST}) がリリースするバージョン (${VERSION}) と一致しません。この定数は移行バッチの起動条件（PluginUpgrade::maybeUpgrade）なので、リリース前にタグと同じ値へ揃えてコミットしてください。"
            exit 1
          fi
          echo "コミット済み AFFILICARD_VERSION (${COMMITTED_CONST}) = リリースするバージョン (${VERSION}) を確認しました。"
          # package.json / package-lock.json（lock はリリース zip に含めないが、次回の npm ci の
          # 入力であり、ずれたまま残ると誰も直さない）。
          # JSON は jq で読む（ubuntu-latest にプリインストール済み。このステップは
          # checkout しか済んでいないので、後段の setup-node に依存しない手段を使う）。
          # 行位置や並び順に依存する読み方（head -5 して grep 等）にすると、説明文の追加や
          # キーの並べ替えだけで値が空になり、バージョンが正しいのにリリースが落ちる。
          # `// empty` は version キー不在時に "null" ではなく空文字を返させるため。
          for f in package.json package-lock.json; do
            PKG="$(jq -r '.version // empty' "${f}")"
            if [ "${PKG}" != "${VERSION}" ]; then
              echo "::error::${f} の version (${PKG}) がリリースするバージョン (${VERSION}) と一致しません。"
              exit 1
            fi
          done
          echo "package.json / package-lock.json のバージョンもタグと一致しています。"
      - name: バージョンを affilicard.php / package.json に注入
        run: |
          echo "Injecting version: ${VERSION}"
          sed -i -E "s/^( \* Version:[[:space:]]*).*/\1${VERSION}/" affilicard.php
          sed -i -E "s/(define\( 'AFFILICARD_VERSION', ')[^']*(' \);)/\1${VERSION}\2/" affilicard.php
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")/\1${VERSION}\2/" package.json
          grep -nE "Version:|AFFILICARD_VERSION" affilicard.php
          grep -nE "\"version\"" package.json | head -1
          # 注入後の実測値で二重に確認する（sed が空振りしても sed 自体は成功する）。
          INJECTED_HEADER="$(grep -E '^ \* Version:' affilicard.php | head -1 | sed -E 's/^ \* Version:[[:space:]]*//')"
          INJECTED_CONST="$(grep -E "define\( 'AFFILICARD_VERSION'," affilicard.php | head -1 | sed -E "s/.*'AFFILICARD_VERSION',[[:space:]]*'([^']*)'.*/\1/")"
          if [ "${INJECTED_HEADER}" != "${VERSION}" ] || [ "${INJECTED_CONST}" != "${VERSION}" ]; then
            echo "::error::注入後の affilicard.php が Version=${INJECTED_HEADER} / AFFILICARD_VERSION=${INJECTED_CONST} でリリースするバージョン (${VERSION}) と一致しません。注入 sed のパターンが実ファイルと合っていない可能性があります。"
            exit 1
          fi
      - name: PHP セットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - name: Node セットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: 本番依存のみインストール
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction
      - name: npm install
        run: npm ci
      - name: JS ビルド
        run: npm run build
      - name: Release zip 作成
        run: |
          mkdir -p dist/affilicard
          rsync -av \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src/Admin/components' \
            --exclude='src/Admin/api' \
            --exclude='tests' \
            --exclude='blueprints' \
            --exclude='composer.lock' \
            --exclude='package-lock.json' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpunit.xml.dist' \
            --exclude='.php-cs-fixer.dist.php' \
            --exclude='.php-cs-fixer.cache' \
            --exclude='.phpunit.cache' \
            --exclude='dist' \
            ./ dist/affilicard/
          cd dist
          zip -r "../affilicard-${TAG}.zip" affilicard
      - name: GitHub Release 作成
        uses: softprops/action-gh-release@v3
        with:
          # 手動実行ではタグがまだ無い。tag_name と target_commitish を渡すと、Release の作成と同時に
          # 検証したコミット（github.sha）へタグが作られる。GITHUB_TOKEN で作ったタグは新しい
          # workflow run を起こさないので、タグ push 契機でこの workflow が二重に走ることもない。
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: affilicard-${{ env.TAG }}.zip
          generate_release_notes: true
