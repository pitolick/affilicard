name: PR Preview - Publish

# PR Preview - Build の成功後に動き、ビルド済み zip を ci-artifacts プレリリースへ
# アップロード（公開 URL 化）し、PR に Playground Preview ボタンを投稿する。
# workflow_run はデフォルトブランチ（main）の定義で実行されるため write 権限を安全に行使できる。

on:
  workflow_run:
    workflows: ['PR Preview - Build']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

# 同じ PR（ブランチ）の公開は 1 本ずつ走らせる。Build が続けて完了すると公開が並走し、
# 古いプレビュー zip の掃除で同じ asset を消し合って、遅れた側が「not found」で失敗していた。
concurrency:
  group: pr-preview-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      pull-requests: write
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-publish.yml@07d56d39d84ecfcdae2e7ddf9dd83e5e6dde769a # v3
    with:
      blueprint-from-artifact: true
